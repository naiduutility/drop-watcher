name: Drop Watcher (worker)

# The old movies.yml watcher is untouched and still runs from movies.json.
# This is its replacement, reading targets from Postgres instead. Both can run
# side by side until the site fully takes over.

on:
  # GitHub's own scheduler throttles frequent crons hard — it was delivering
  # roughly one run every five hours — so this exists as a backstop only. The
  # real cadence comes from an external cron calling workflow_dispatch.
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

# One pass at a time. Targets are claimed FOR UPDATE SKIP LOCKED so overlapping
# runs would be safe, but serialising keeps request volume at one IP honest.
concurrency:
  group: dw-worker
  cancel-in-progress: false

jobs:
  pass:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci

      # Measured on 2026-09-23, same minute, two IPs: curl fetched the whole
      # payload in 0.6s from a residential connection and was refused with a
      # flat HTTP 403 from a GitHub runner. BookMyShow's Cloudflare scores the
      # datacenter IP, not just the client. So on Actions a browser is not the
      # fallback — it is the only transport that works, and PREFER_BROWSER
      # below stops the worker spending a doomed request to rediscover that
      # every single pass.
      - name: Cache Chromium
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run one pass
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APP_URL: ${{ secrets.APP_URL }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          PREFER_BROWSER: "1"
        run: npx tsx src/worker/run.ts
