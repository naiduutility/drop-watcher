name: Movie Ticket Watcher

on:
  schedule:
    # Every 5 minutes. NOTE: GitHub's scheduler is best-effort and can be
    # delayed by several minutes when the platform is busy.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # lets you run it manually from the Actions tab

# Don't let a slow run overlap the next scheduled one. Also protects the
# alert-state cache from concurrent writes.
concurrency:
  group: bms-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # Cache the downloaded Chromium so we don't re-download it every 5 min.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}

      # Which movies you've already acknowledged, carried between runs.
      # restore/save (not the combined cache action) because this state is
      # MUTABLE — cache entries are immutable per key, so each run saves under
      # a fresh run_id key and restores the newest via the restore-keys prefix.
      - name: Restore alert state
        uses: actions/cache/restore@v6
        with:
          path: .state
          key: bms-alert-state-${{ github.run_id }}
          restore-keys: |
            bms-alert-state-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Check BookMyShow
        env:
          # Movies live in movies.json. NTFY_ACK_TOPIC defaults to
          # "<NTFY_TOPIC>-ack" — only set the secret to override it.
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_ACK_TOPIC: ${{ secrets.NTFY_ACK_TOPIC }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: |
          mkdir -p .state
          python check.py --only movies

      # if: always() so an acknowledgement recorded before a later movie's
      # check failed still persists.
      - name: Save alert state
        if: always()
        uses: actions/cache/save@v6
        with:
          path: .state
          key: bms-alert-state-${{ github.run_id }}
